<body class="bg-gradient-to-br from-blue-600 via-blue-500 to-purple-600 min-h-screen p-3">
    <div id="app" class="max-w-xl mx-auto"></div>
    <script>
        // ============================================
        // KONFIGURASI
        // ============================================
        const SUPABASE_URL = 'https://vicvnciuwroqmvvkkmsa.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpY3ZuY2l1d3JvcW12dmtrbXNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA1OTAyNjQsImV4cCI6MjA4NjE2NjI2NH0.R1B1rMfsy2_bxK4BM6tWj-ObnKHk-sJY_H-0zMyv9VY';
        const ADMIN_USERNAME = 'Unknown';
        const ADMIN_PASSWORD = '123456';
        const STORAGE_KEY  = 'reading_missions_v1';
        const CHAPTER_KEY  = 'chapter_unit_v1';
        const PROGRESS_KEY = 'reading_progress_v1';
        const AUDIO_BUCKET = 'recordings';

        let supabaseClient = null;
        function initSupabase() {
            if (typeof supabase !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                return true;
            }
            return false;
        }

        // ============================================
        // DATA DEFAULT
        // ============================================
        const defaultMissions = {
            beginner: [
                "I love to travel and see new places",
                "The beach is very beautiful today",
                "We visited a wonderful museum yesterday",
                "My family enjoys camping in the mountains",
                "The hotel room has a nice view",
                "I like to take pictures of nature",
                "Traveling makes me very happy"
            ],
            intermediate: [
                "I had an amazing experience during my trip to Bali last summer",
                "The view from the mountain top was absolutely breathtaking",
                "We explored ancient temples and learned about local culture",
                "Swimming in the crystal clear water was unforgettable",
                "The local food was delicious and very spicy",
                "I met many friendly people during my vacation",
                "This journey has changed my perspective on life"
            ],
            advanced: [
                "Embarking on this extraordinary adventure provided invaluable insights",
                "The magnificent landscape encompassed towering peaks and pristine valleys",
                "Immersing myself in diverse cultures broadened my global understanding",
                "Navigating through challenging terrain tested my physical endurance",
                "The architectural marvels demonstrated remarkable historical significance",
                "Interacting with indigenous communities enriched my cultural awareness",
                "This transformative expedition fundamentally altered my worldview"
            ],
            expert: [
                "Traversing through this unprecedented expedition yielded profound comprehension",
                "The intricate tapestry of cultural nuances necessitated meticulous observation",
                "Synthesizing experiential knowledge with theoretical frameworks proved invaluable",
                "Confronting linguistic barriers facilitated unprecedented cognitive adaptation",
                "The ephemeral beauty of untouched wilderness evoked sublime contemplation",
                "Navigating complex socio-political landscapes demanded diplomatic acumen",
                "This paradigm-shifting odyssey transcended conventional pedagogical boundaries"
            ]
        };

        const scoringThresholds = {
            beginner:     { excellent: 70, good: 50, enough: 30 },
            intermediate: { excellent: 80, good: 60, enough: 35 },
            advanced:     { excellent: 88, good: 68, enough: 42 },
            expert:       { excellent: 95, good: 75, enough: 50 }
        };

        // ============================================
        // STATE
        // ============================================
        var state = {
            studentName: '', studentClass: '', selectedLevel: '', showForm: true,
            currentMission: 0, missionScores: [], showFinalScore: false,
            isSpeaking: false, isRecording: false, transcript: '', showResult: false,
            recognition: null, showAdminLogin: false, showAdminMenu: false,
            adminView: null, adminUser: '', adminPass: '',
            adminSelectedLevel: 'beginner', adminNewSentence: '', adminEditIndex: null, adminEditValue: '',
            chapterTitle: 'Chapter 2: Taking Trips', unitTitle: 'Unit 2: What an Experience',
            filterLevel: 'all', filterClass: '', searchName: '',
            isLoading: false, dbResults: [],
            isUploadingAudio: false,
            audioBlobs: [], currentAudioURL: null,
            isVoiceRecording: false, voiceCountdown: 0
        };

        // Variabel audio (di luar state karena berisi object binary)
        var mediaRecorder = null;
        var audioChunks   = [];
        var voiceTimer    = null;

        // ============================================
        // LOCAL STORAGE HELPERS
        // ============================================
        function loadMissions() {
            try {
                var raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(defaultMissions));
            } catch(e) { return JSON.parse(JSON.stringify(defaultMissions)); }
        }
        function saveMissions(m) { localStorage.setItem(STORAGE_KEY, JSON.stringify(m)); }

        function loadChapterUnit() {
            try {
                var raw = localStorage.getItem(CHAPTER_KEY);
                return raw ? JSON.parse(raw) : { chapter: 'Chapter 2: Taking Trips', unit: 'Unit 2: What an Experience' };
            } catch(e) { return { chapter: 'Chapter 2: Taking Trips', unit: 'Unit 2: What an Experience' }; }
        }
        function saveChapterUnit(ch, un) { localStorage.setItem(CHAPTER_KEY, JSON.stringify({ chapter: ch, unit: un })); }

        function saveProgress() {
            if (state.showForm || state.showFinalScore) { localStorage.removeItem(PROGRESS_KEY); return; }
            localStorage.setItem(PROGRESS_KEY, JSON.stringify({
                studentName: state.studentName, studentClass: state.studentClass,
                selectedLevel: state.selectedLevel, currentMission: state.currentMission,
                missionScores: state.missionScores, transcript: state.transcript,
                showResult: state.showResult
            }));
        }
        function loadProgress() {
            try {
                var raw = localStorage.getItem(PROGRESS_KEY);
                if (!raw) return false;
                var p = JSON.parse(raw);
                if (!p.studentName || !p.selectedLevel) return false;
                state.studentName    = p.studentName;
                state.studentClass   = p.studentClass;
                state.selectedLevel  = p.selectedLevel;
                state.currentMission = p.currentMission || 0;
                state.missionScores  = p.missionScores  || [];
                state.transcript     = p.transcript     || '';
                state.showResult     = p.showResult     || false;
                state.showForm = false; state.showFinalScore = false;
                state.audioBlobs = Array(missionsByLevel[p.selectedLevel].length).fill(null);
                initSpeech();
                return true;
            } catch(e) { return false; }
        }
        function clearProgress() { localStorage.removeItem(PROGRESS_KEY); }

        // Init data
        var missionsByLevel = loadMissions();
        var savedCU = loadChapterUnit();
        state.chapterTitle = savedCU.chapter;
        state.unitTitle    = savedCU.unit;

        // ============================================
        // SPEECH RECOGNITION
        // ============================================
        function initSpeech() {
            if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) return false;
            var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            var r = new SR();
            r.continuous = false; r.interimResults = false; r.lang = 'en-US';
            r.onstart  = function() { state.isRecording = true;  render(); };
            r.onresult = function(e) { state.transcript = e.results[0][0].transcript; state.isRecording = false; render(); };
            r.onerror  = function() { state.isRecording = false; render(); };
            r.onend    = function() { state.isRecording = false; render(); };
            state.recognition = r;
            return true;
        }

        // ============================================
        // AUDIO RECORDING (terpisah dari speech recognition)
        // ============================================
        function stopAudioRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
        }

        function startAudioRecording(onDone) {
            audioChunks = [];
            if (typeof MediaRecorder === 'undefined') { if (onDone) onDone(false); return; }
            navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
                var mime = '';
                var types = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];
                for (var i = 0; i < types.length; i++) {
                    if (MediaRecorder.isTypeSupported(types[i])) { mime = types[i]; break; }
                }
                mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
                mediaRecorder.ondataavailable = function(e) { if (e.data && e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = function() {
                    var finalType = mediaRecorder.mimeType || 'audio/webm';
                    var blob = new Blob(audioChunks, { type: finalType });
                    state.audioBlobs[state.currentMission] = blob;
                    if (state.currentAudioURL) URL.revokeObjectURL(state.currentAudioURL);
                    state.currentAudioURL = URL.createObjectURL(blob);
                    stream.getTracks().forEach(function(t) { t.stop(); });
                    state.isVoiceRecording = false;
                    render();
                };
                mediaRecorder.onerror = function() {
                    stream.getTracks().forEach(function(t) { t.stop(); });
                    state.isVoiceRecording = false;
                    render();
                };
                mediaRecorder.start(100);
                if (onDone) onDone(true);
            }).catch(function() { if (onDone) onDone(false); });
        }

        function handleRecordVoice() {
            if (state.isVoiceRecording) return;
            state.isVoiceRecording = true;
            state.voiceCountdown = 5;
            render();
            startAudioRecording(function(ok) {
                if (!ok) {
                    state.isVoiceRecording = false;
                    render();
                    alert('❌ Gagal mengakses microphone!');
                    return;
                }
                voiceTimer = setInterval(function() {
                    state.voiceCountdown--;
                    render();
                    if (state.voiceCountdown <= 0) {
                        clearInterval(voiceTimer);
                        stopAudioRecording();
                    }
                }, 1000);
            });
        }

        async function uploadAudioToStorage(blob, studentName, level, idx) {
            if (!supabaseClient || !blob) return null;
            try {
                var safeName = studentName.replace(/[^a-zA-Z0-9]/g, '_');
                var ext = blob.type.includes('mp4') ? 'mp4' : blob.type.includes('ogg') ? 'ogg' : 'webm';
                var fileName = Date.now() + '_' + safeName + '_' + level + '_M' + (idx+1) + '.' + ext;
                var res = await supabaseClient.storage.from(AUDIO_BUCKET).upload(fileName, blob, { contentType: blob.type });
                if (res.error) throw res.error;
                var urlRes = supabaseClient.storage.from(AUDIO_BUCKET).getPublicUrl(fileName);
                return urlRes.data.publicUrl;
            } catch(e) { console.error('Upload audio error:', e); return null; }
        }

        function playAudio(url) {
            if (!url) { alert('⚠️ Rekaman tidak tersedia'); return; }
            var a = new Audio(url);
            a.play().catch(function() { alert('Gagal memutar audio'); });
        }

        // ============================================
        // SUPABASE DATABASE
        // ============================================
        async function saveToSupabase(data) {
            if (!supabaseClient) return false;
            try {
                state.isLoading = true; render();
                var res = await supabaseClient.from('student_results').insert([{
                    student_name: data.name, student_class: data.class,
                    level: data.level, score: data.score, grade: data.grade,
                    chapter_title: data.chapter, unit_title: data.unit,
                    mission_scores: data.missionScores, audio_urls: data.audioUrls || []
                }]);
                if (res.error) throw res.error;
                return true;
            } catch(e) {
                alert('Gagal menyimpan ke cloud. Periksa koneksi internet.');
                return false;
            } finally { state.isLoading = false; render(); }
        }

        async function loadFromSupabase() {
            if (!supabaseClient) return [];
            try {
                var q = supabaseClient.from('student_results').select('*').order('created_at', { ascending: false });
                if (state.filterLevel !== 'all') q = q.eq('level', state.filterLevel);
                if (state.filterClass.trim()) q = q.ilike('student_class', '%' + state.filterClass + '%');
                if (state.searchName.trim())  q = q.ilike('student_name',  '%' + state.searchName  + '%');
                var res = await q;
                if (res.error) throw res.error;
                return res.data.map(function(r) { return {
                    id: r.id, name: r.student_name, class: r.student_class,
                    level: r.level, score: r.score, grade: r.grade,
                    date: new Date(r.created_at).toLocaleDateString('id-ID'),
                    time: new Date(r.created_at).toLocaleTimeString('id-ID'),
                    chapter: r.chapter_title, unit: r.unit_title,
                    missionScores: r.mission_scores || [],
                    audioUrls: r.audio_urls || []
                }; });
            } catch(e) { console.error(e); return []; }
        }

        async function deleteFromSupabase(id) {
            if (!supabaseClient) return false;
            try {
                var res = await supabaseClient.from('student_results').delete().eq('id', id);
                if (res.error) throw res.error;
                return true;
            } catch(e) { return false; }
        }

        // ============================================
        // HELPER FUNCTIONS
        // ============================================
        async function testMic() {
            try {
                var s = await navigator.mediaDevices.getUserMedia({ audio: true });
                s.getTracks().forEach(function(t) { t.stop(); });
                alert('✅ MICROPHONE BERHASIL!');
            } catch(e) { alert('❌ MICROPHONE DITOLAK!'); }
        }

        function getFinalScore() {
            var sv = { 'Excellent': 100, 'Good': 75, 'Enough': 50, 'Bad': 25 };
            var total = missionsByLevel[state.selectedLevel].length || 1;
            var sum = state.missionScores.reduce(function(s, sc) { return s + (sv[sc] || 0); }, 0);
            return Math.round(sum / total);
        }
        function getFinalGrade(avg) {
            if (avg >= 85) return 'Excellent';
            if (avg >= 65) return 'Good';
            if (avg >= 40) return 'Enough';
            return 'Bad';
        }
        function calculateScore(orig, spk, lvl) {
            if (!spk) return 'Bad';
            var norm = function(t) { return t.toLowerCase().replace(/[.,!?'"]/g,'').trim(); };
            var ow = norm(orig).split(' '), sw = norm(spk).split(' '), m = 0;
            ow.forEach(function(w) { if (sw.indexOf(w) !== -1) m++; });
            var acc = (m / ow.length) * 100, th = scoringThresholds[lvl];
            if (acc >= th.excellent) return 'Excellent';
            if (acc >= th.good)      return 'Good';
            if (acc >= th.enough)    return 'Enough';
            return 'Bad';
        }
        function getScoreColor(s) {
            return { 'Excellent':'bg-green-500 text-white','Good':'bg-blue-500 text-white','Enough':'bg-yellow-500 text-white','Bad':'bg-red-500 text-white' }[s] || 'bg-gray-500 text-white';
        }
        function getScoreColorLight(s) {
            return { 'Excellent':'text-green-700 bg-green-100 border-2 border-green-400','Good':'text-blue-700 bg-blue-100 border-2 border-blue-400','Enough':'text-yellow-700 bg-yellow-100 border-2 border-yellow-400','Bad':'text-red-700 bg-red-100 border-2 border-red-400' }[s] || 'text-gray-700 bg-gray-100';
        }
        function getLevelColor(l) {
            return { beginner:'bg-green-500', intermediate:'bg-blue-500', advanced:'bg-purple-500', expert:'bg-red-500' }[l] || 'bg-gray-500';
        }
        function getLevelName(l) {
            return { beginner:'🌱 BEGINNER', intermediate:'🌿 INTERMEDIATE', advanced:'🌳 ADVANCED', expert:'🏆 EXPERT' }[l] || l;
        }

        // ============================================
        // EVENT HANDLERS
        // ============================================
        function handleStart() {
            var n = document.getElementById('studentName').value.trim();
            var c = document.getElementById('studentClass').value.trim();
            var l = document.getElementById('level').value;
            if (!n || !c || !l) { alert('⚠️ Lengkapi semua field!'); return; }
            state.studentName = n; state.studentClass = c; state.selectedLevel = l;
            state.showForm = false; state.missionScores = Array(missionsByLevel[l].length).fill(null);
            state.audioBlobs = Array(missionsByLevel[l].length).fill(null);
            state.currentAudioURL = null;
            initSpeech(); render();
        }

        function speakText() {
            if (window.speechSynthesis.speaking) { window.speechSynthesis.cancel(); state.isSpeaking = false; render(); return; }
            var u = new SpeechSynthesisUtterance(missionsByLevel[state.selectedLevel][state.currentMission]);
            u.lang = 'en-US'; u.rate = 0.6;
            u.onstart = function() { state.isSpeaking = true; render(); };
            u.onend   = function() { state.isSpeaking = false; render(); };
            window.speechSynthesis.speak(u);
        }

        function handleJudge() {
            if (!state.recognition) return;
            state.transcript = ''; state.showResult = false;
            state.currentAudioURL = null;
            state.audioBlobs[state.currentMission] = null;
            state.isVoiceRecording = false;
            if (voiceTimer) { clearInterval(voiceTimer); voiceTimer = null; }
            render();
            try { state.recognition.start(); } catch(e) { console.error(e); }
        }

        function handleResult() {
            if (!state.transcript) { alert('⚠️ Klik JUDGE dulu!'); return; }
            state.missionScores[state.currentMission] = calculateScore(
                missionsByLevel[state.selectedLevel][state.currentMission],
                state.transcript, state.selectedLevel
            );
            state.showResult = true; render();
        }

        async function handleNext() {
            if (!state.missionScores[state.currentMission]) { alert('⚠️ Klik RESULT dulu!'); return; }
            var total = missionsByLevel[state.selectedLevel].length;
            if (state.currentMission < total - 1) {
                state.currentMission++; state.transcript = ''; state.showResult = false;
                state.currentAudioURL = null; state.isVoiceRecording = false;
                if (voiceTimer) { clearInterval(voiceTimer); voiceTimer = null; }
                render();
            } else {
                await saveStudentResult();
                clearProgress();
                state.showFinalScore = true; render();
            }
        }

        async function saveStudentResult() {
            var finalScore = getFinalScore(), finalGrade = getFinalGrade(finalScore);
            state.isUploadingAudio = true; render();
            var audioUrls = [];
            for (var i = 0; i < state.audioBlobs.length; i++) {
                if (state.audioBlobs[i]) {
                    audioUrls.push(await uploadAudioToStorage(state.audioBlobs[i], state.studentName, state.selectedLevel, i));
                } else { audioUrls.push(null); }
            }
            state.isUploadingAudio = false;
            await saveToSupabase({
                name: state.studentName, class: state.studentClass,
                level: state.selectedLevel, score: finalScore, grade: finalGrade,
                chapter: state.chapterTitle, unit: state.unitTitle,
                missionScores: state.missionScores.slice(), audioUrls: audioUrls
            });
        }

        function restartApp() {
            clearProgress();
            state.showForm = true; state.showFinalScore = false; state.currentMission = 0;
            state.transcript = ''; state.showResult = false; state.missionScores = [];
            state.audioBlobs = []; state.currentAudioURL = null;
            render();
        }

        function exitToHome() {
            if (confirm('⚠️ Keluar dari Reading Test?\n\nProgress Anda akan hilang!')) {
                clearProgress();
                state.showForm = true; state.showFinalScore = false; state.currentMission = 0;
                state.transcript = ''; state.showResult = false; state.missionScores = [];
                state.studentName = ''; state.studentClass = ''; state.selectedLevel = '';
                state.audioBlobs = []; state.currentAudioURL = null;
                render();
            }
        }

        function openAdmin()  { state.showAdminLogin = true; render(); }
        function closeAdmin() { state.showAdminLogin = false; state.showAdminMenu = false; state.adminView = null; state.adminUser = ''; state.adminPass = ''; render(); }
        function handleLogin() {
            if (state.adminUser === ADMIN_USERNAME && state.adminPass === ADMIN_PASSWORD) {
                state.showAdminLogin = false; state.showAdminMenu = true; state.adminView = 'menu';
            } else { alert('❌ Salah!'); }
            render();
        }
        function gotoMenu()    { state.adminView = 'menu';     render(); }
        function gotoAdd()     { state.adminView = 'add';      render(); }
        function gotoChange()  { state.adminView = 'change';   render(); }
        function gotoChapter() { state.adminView = 'chapter';  render(); }

        async function gotoStudentList() {
            state.adminView = 'students'; state.filterLevel = 'all'; state.filterClass = ''; state.searchName = '';
            await renderStudentListData();
        }
        async function renderStudentListData() {
            state.isLoading = true; render();
            state.dbResults = await loadFromSupabase();
            state.isLoading = false; render();
        }
        function updateChapter() {
            var ch = document.getElementById('chInput').value.trim();
            var un = document.getElementById('unInput').value.trim();
            if (ch && un) { state.chapterTitle = ch; state.unitTitle = un; saveChapterUnit(ch, un); alert('✅ Berhasil!'); render(); }
        }
        function addMaterial() {
            var txt = (state.adminNewSentence || '').trim();
            if (!txt) { alert('Kosong!'); return; }
            missionsByLevel[state.adminSelectedLevel].push(txt);
            saveMissions(missionsByLevel); state.adminNewSentence = ''; alert('✅ Ditambahkan!'); render();
        }
        function deleteMaterial(lvl, idx) {
            if (!confirm('Hapus?')) return;
            missionsByLevel[lvl].splice(idx, 1); saveMissions(missionsByLevel); render();
        }
        function startEdit(lvl, idx) { state.adminEditIndex = idx; state.adminEditValue = missionsByLevel[lvl][idx]; render(); }
        function cancelEdit()         { state.adminEditIndex = null; state.adminEditValue = ''; render(); }
        function saveEdit(lvl, idx) {
            var txt = (state.adminEditValue || '').trim();
            if (!txt) { alert('Kosong!'); return; }
            missionsByLevel[lvl][idx] = txt; saveMissions(missionsByLevel);
            state.adminEditIndex = null; state.adminEditValue = ''; alert('✅ Diperbarui!'); render();
        }
        async function deleteResult(id) {
            if (!confirm('Hapus data siswa ini?')) return;
            var ok = await deleteFromSupabase(id);
            if (ok) { alert('✅ Data dihapus!'); await renderStudentListData(); }
            else alert('❌ Gagal menghapus data');
        }
        async function clearAllResults() {
            if (!confirm('HAPUS SEMUA DATA SISWA?\nTindakan ini tidak dapat dibatalkan!')) return;
            if (!confirm('Apakah Anda yakin? Data akan hilang permanent!')) return;
            var res = await loadFromSupabase();
            for (var i = 0; i < res.length; i++) await deleteFromSupabase(res[i].id);
            alert('✅ Semua data telah dihapus!'); await renderStudentListData();
        }

        function downloadExcel() {
            var results = state.dbResults || [];
            if (!results.length) { alert('Tidak ada data!'); return; }
            var ws_data = [
                ['ENGLISH READING ASSESSMENT REPORT'],
                ['Chapter: ' + state.chapterTitle],['Unit: ' + state.unitTitle],
                ['Tanggal: ' + new Date().toLocaleDateString('id-ID')],[],
                ['No','Nama Siswa','Kelas','Level','Score','Predikat','Tanggal','Waktu']
            ];
            results.forEach(function(r, i) { ws_data.push([i+1,r.name,r.class,getLevelName(r.level),r.score,r.grade,r.date,r.time]); });
            var wb = XLSX.utils.book_new(), ws = XLSX.utils.aoa_to_sheet(ws_data);
            ws['!cols'] = [{wch:5},{wch:25},{wch:10},{wch:18},{wch:8},{wch:12},{wch:15},{wch:12}];
            XLSX.utils.book_append_sheet(wb, ws, 'Results');
            XLSX.writeFile(wb, 'Reading_Assessment_' + new Date().toISOString().split('T')[0] + '.xlsx');
        }

        function downloadPDF() {
            var results = state.dbResults || [];
            if (!results.length) { alert('Tidak ada data!'); return; }
            var pw = window.open('','','width=900,height=700');
            var h = '<html><head><title>Reading Assessment Report</title><style>';
            h += 'body{font-family:Arial,sans-serif;padding:20px}h1{text-align:center;color:#1e40af}';
            h += 'table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #ddd;padding:8px;font-size:11px}';
            h += 'th{background:#3b82f6;color:white}.header-info{background:#f0f9ff;padding:15px;border-radius:8px;border:2px solid #3b82f6;margin-bottom:20px}';
            h += '.excellent{color:#15803d;font-weight:bold}.good{color:#1d4ed8;font-weight:bold}.enough{color:#a16207;font-weight:bold}.bad{color:#b91c1c;font-weight:bold}';
            h += '@media print{button{display:none}}</style></head><body>';
            h += '<h1>📊 ENGLISH READING ASSESSMENT REPORT</h1><div class="header-info">';

        function renderAssessment(app) {
            if (state.isUploadingAudio) {
                app.innerHTML = '<div class="min-h-screen flex items-center justify-center p-4"><div class="bg-white rounded-3xl shadow-2xl p-8 text-center"><div class="text-5xl mb-3">☁️</div><p class="text-gray-700 font-bold text-lg">Mengupload rekaman...</p><p class="text-xs text-gray-500 mt-1">Mohon tunggu sebentar</p></div></div>';
                return;
            }
            var missions = missionsByLevel[state.selectedLevel], total = missions.length;
            var cs = state.missionScores[state.currentMission];
            var h = '<div class="space-y-3">';

            // Card info siswa + OUT
            h += '<div class="bg-white rounded-2xl p-4 shadow-lg border-2 border-blue-200">';
            h += '<div class="grid grid-cols-2 gap-4 mb-3">';
            h += '<div class="border-r border-gray-300 pr-3"><p class="text-xs text-gray-500 font-bold mb-1">STUDENT</p><p class="text-base font-black text-gray-900 truncate">'+state.studentName+'</p></div>';
            h += '<div class="pl-3"><p class="text-xs text-gray-500 font-bold mb-1">CLASS</p><p class="text-base font-black text-gray-900">'+state.studentClass+'</p></div></div>';
            h += '<div class="flex justify-between items-center pt-3 border-t border-gray-300">';
            h += '<span class="'+getLevelColor(state.selectedLevel)+' text-white px-3 py-1 rounded-lg font-bold text-xs">'+getLevelName(state.selectedLevel)+'</span>';
            h += '<button onclick="exitToHome()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg font-bold text-xs flex items-center gap-1">🚪 OUT</button>';
            h += '</div></div>';

            // STEPS
            h += '<div class="bg-white rounded-2xl p-4 shadow-lg border-2 border-gray-300">';
            h += '<p class="text-sm font-bold text-gray-800 mb-3">📋 STEPS:</p>';
            h += '<ol class="text-xs text-gray-700 space-y-1 list-decimal list-inside">';
            h += '<li>Click <span class="text-blue-600 font-bold">LISTEN</span> to hear pronunciation</li>';
            h += '<li>Click <span class="text-green-600 font-bold">JUDGE</span> to start recording</li>';
            h += '<li><span class="font-bold">Read the sentence</span> clearly and loudly</li>';
            h += '<li>Wait for text to appear (green box)</li>';
            h += '<li>Click <span class="text-blue-600 font-bold">RESULT</span> to see your score</li>';
            h += '<li>Click <span class="text-purple-600 font-bold">NEXT</span> for next mission</li>';
            h += '</ol></div>';

            // Test mic
            h += '<button onclick="testMic()" class="w-full bg-gradient-to-r from-green-500 to-blue-500 text-white py-3 px-4 rounded-2xl font-black text-base hover:from-green-600 hover:to-blue-600 shadow-lg flex items-center justify-center gap-2"><span class="text-2xl">🎤</span> TEST MICROPHONE</button>';

            // Reading card
            h += '<div class="bg-white rounded-3xl shadow-2xl p-5">';
            h += '<div class="text-center mb-4">';
            h += '<div class="flex items-center justify-center gap-2 mb-2"><span class="text-3xl">📚</span><h1 class="text-xl font-bold text-gray-900">Reading Test</h1></div>';
            h += '<p class="text-xs text-gray-600 font-semibold">'+state.chapterTitle+' - '+state.unitTitle+'</p>';
            h += '<p class="text-lg font-bold text-gray-900 mt-2">Mission '+(state.currentMission+1)+' of '+total+'</p>';
            h += '<div class="w-full bg-gray-200 rounded-full h-3 mt-2">';
            h += '<div class="bg-gradient-to-r from-blue-500 to-purple-600 h-3 rounded-full transition-all" style="width:'+Math.round(((state.currentMission+1)/total)*100)+'%"></div></div></div>';

            // Kalimat
            h += '<div class="bg-gradient-to-r from-blue-50 to-purple-50 rounded-2xl p-4 mb-4 border-2 border-blue-300">';
            h += '<div class="flex justify-between items-start mb-3"><h2 class="text-sm font-bold text-gray-900">📖 Read this:</h2>';
            var speakBtn = state.isSpeaking ? 'bg-red-500 hover:bg-red-600 text-white' : 'bg-blue-500 hover:bg-blue-600 text-white';
            h += '<button onclick="speakText()" class="flex items-center gap-2 px-4 py-2 rounded-xl font-bold text-sm shadow-lg transition '+speakBtn+'">🔊 '+(state.isSpeaking?'STOP':'LISTEN')+'</button></div>';
            h += '<p class="text-base text-gray-900 leading-relaxed font-semibold">"'+missions[state.currentMission]+'"</p></div>';

            // Recording state
            if (state.isRecording) {
                h += '<div class="bg-red-50 border-2 border-red-500 rounded-2xl p-4 mb-4 text-center animate-pulse">';
                h += '<div class="text-5xl mb-2">🎤</div><p class="text-red-800 font-black text-lg">RECORDING...</p></div>';
            }

            // Transcript + verifikasi suara
            if (state.transcript) {
                h += '<div class="bg-green-50 border-2 border-green-500 rounded-2xl p-4 mb-4">';
                h += '<p class="text-xs text-green-700 font-bold mb-2">✅ YOUR RECORDING:</p>';
                h += '<p class="text-sm text-gray-900 font-semibold italic mb-3">"'+state.transcript+'"</p>';
                if (state.currentAudioURL) {
                    h += '<audio controls class="w-full mb-2" src="'+state.currentAudioURL+'"></audio>';
                }
                if (!state.isVoiceRecording && !state.currentAudioURL) {
                    h += '<button onclick="handleRecordVoice()" class="w-full mb-2 py-2 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl text-xs flex items-center justify-center gap-2">🎙️ Rekam Suara Verifikasi (5 detik)</button>';
                }
                if (state.isVoiceRecording) {
                    h += '<div class="bg-orange-50 border-2 border-orange-400 rounded-xl p-2 mb-2 text-center animate-pulse">';
                    h += '<p class="text-orange-700 font-black text-sm">🎙️ Merekam... Baca ulang kalimat! ('+state.voiceCountdown+'s)</p></div>';
                }
                h += '<p class="text-yellow-700 font-bold text-xs">👉 Click RESULT to get score</p></div>';
            }

            // Score result
            if (state.showResult && cs) {
                h += '<div class="rounded-2xl p-5 mb-4 text-center border-4 shadow-xl '+getScoreColor(cs)+'">';
                h += '<div class="text-5xl mb-2">✔</div><p class="text-sm font-bold mb-1">YOUR SCORE:</p>';
                h += '<p class="text-4xl font-black mb-2">'+cs+'</p></div>';
            }

            // Tombol JUDGE / RESULT / NEXT
            h += '<div class="grid grid-cols-3 gap-3 mb-4">';
            h += '<button onclick="handleJudge()"'+(state.isRecording||state.isVoiceRecording?' disabled':'')+' class="bg-green-500 text-white py-4 rounded-2xl font-black text-sm hover:bg-green-600 disabled:bg-gray-400 shadow-lg transition transform hover:scale-105"><div class="text-2xl mb-1">🎤</div>JUDGE</button>';
            h += '<button onclick="handleResult()"'+(!state.transcript||state.isRecording?' disabled':'')+' class="bg-blue-500 text-white py-4 rounded-2xl font-black text-sm hover:bg-blue-600 disabled:bg-gray-400 shadow-lg transition transform hover:scale-105"><div class="text-2xl mb-1">✔</div>RESULT</button>';
            h += '<button onclick="handleNext()"'+(!cs?' disabled':'')+' class="bg-purple-500 text-white py-4 rounded-2xl font-black text-sm hover:bg-purple-600 disabled:bg-gray-400 shadow-lg transition transform hover:scale-105"><div class="text-2xl mb-1">→</div>'+(state.currentMission<total-1?'NEXT':'FINISH')+'</button></div>';

            // Bubble mission
            h += '<div class="flex justify-center gap-2 flex-wrap">';
            missions.forEach(function(_, idx) {
                var ac = state.missionScores[idx] ? 'bg-green-500 text-white' : (idx===state.currentMission?'bg-blue-500 text-white':'bg-gray-300 text-gray-600');
                h += '<div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm shadow-md '+ac+'">'+(idx+1)+'</div>';
            });
            h += '</div></div></div>';
            app.innerHTML = h;
        }

        // ============================================
        // INIT
        // ============================================
        window.onload = function() {
            initSupabase();
            loadProgress();
            render();
        };
    </script>
</body>
</html>
